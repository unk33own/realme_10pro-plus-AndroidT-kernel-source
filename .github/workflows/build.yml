
name: Build KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc libncurses5-dev libssl-dev flex bison libelf-dev zip unzip libc6-dev-i386 lib32z1-dev python3

      - name: Fetch AOSP Toolchains
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchain/clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/gcc32

      - name: Integrate KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Fix Missing Kconfig Files Automatically
        run: |
          python3 -c '
          import os, re
          pattern = re.compile(r"^\s*(?:r?source)\s+[\"\x27]?([^\"\x27\s]+)[\"\x27]?", re.M)
          for _ in range(3):
              for root, _, files in os.walk("."):
                  for file in files:
                      if "Kconfig" in file:
                          filepath = os.path.join(root, file)
                          try:
                              with open(filepath, "r", errors="ignore") as f:
                                  content = f.read()
                              for target in pattern.findall(content):
                                  target = target.strip()
                                  if target and not os.path.exists(target):
                                      os.makedirs(os.path.dirname(target), exist_ok=True)
                                      open(target, "w").close()
                                      mk = os.path.join(os.path.dirname(target), "Makefile")
                                      if not os.path.exists(mk):
                                          with open(mk, "w") as mf:
                                              mf.write("obj-y += \n")
                          except Exception:
                              pass
          '

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$(pwd)/toolchain/clang/clang-r383902/bin:$(pwd)/toolchain/gcc64/bin:$(pwd)/toolchain/gcc32/bin:$PATH

          CONFIG_PATH=$(find arch/arm64/configs -type f \( -name "*roma*" -o -name "*3686*" -o -name "*k6873*" -o -name "*defconfig*" \) | head -n 1)
          
          echo "CONFIG_KSU=y" >> $CONFIG_PATH
          echo "CONFIG_KSU_TAMPER_SYS_CALL=y" >> $CONFIG_PATH
          
          TARGET_DEFCONFIG=$(basename $CONFIG_PATH)
          
          make O=out $TARGET_DEFCONFIG
          make -j$(nproc) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Pack Kernel Output
        run: |
          mkdir -p output
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb output/kernel
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz output/kernel
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image output/kernel
          fi
          cd output && zip -r ../KernelSU-Next-RMX3686.zip *

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Kernel
          path: KernelSU-Next-RMX3686.zip