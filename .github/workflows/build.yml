name: Build KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y git build-essential bc libncurses5-dev libssl-dev flex bison libelf-dev zip unzip clang lld

      - name: Integrate KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out vendor/roma_defconfig
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_TAMPER_SYS_CALL=y" >> out/.config
          make -j$(nproc) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-

      - name: Pack with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../KernelSU-Next-RMX3686.zip *

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Kernel
          path: KernelSU-Next-RMX3686.zip
