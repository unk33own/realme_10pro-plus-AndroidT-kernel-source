name: Build KernelSU Next Auto Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc libncurses5-dev libssl-dev flex bison libelf-dev zip unzip libc6-dev-i386 lib32z1-dev python3 liblz4-tool ccache

      - name: Fetch Toolchains
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchain/clang_aosp
          CLANG_PATH=$(find toolchain/clang_aosp -name "bin" -type d | grep "clang-r" | head -n 1 | xargs dirname)
          mv $CLANG_PATH toolchain/clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/gcc32

      - name: Integrate KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Pre-fix Missing Kconfig and Makefiles
        run: |
          cat << 'EOF' > auto_fix_source.py
          import os, re, shutil

          def create_stub_dir(dir_path):
              if not dir_path or dir_path == ".":
                  return
              try:
                  dir_path = os.path.normpath(dir_path)
                  if os.path.exists(dir_path) and not os.path.isdir(dir_path):
                      os.remove(dir_path)
                  os.makedirs(dir_path, exist_ok=True)
                  
                  mk = os.path.join(dir_path, "Makefile")
                  if not os.path.exists(mk):
                      with open(mk, "w") as f:
                          f.write("obj-y +=\n")
                          
                  kc = os.path.join(dir_path, "Kconfig")
                  if not os.path.exists(kc):
                      open(kc, "w").close()
              except Exception:
                  pass

          # 1. Fix Missing Kconfig includes
          for _ in range(3):
              for root, _, files in os.walk("."):
                  for file in files:
                      if "Kconfig" in file:
                          filepath = os.path.join(root, file)
                          try:
                              with open(filepath, "r", errors="ignore") as f:
                                  lines = f.readlines()
                              new_lines = []
                              modified = False
                              for line in lines:
                                  m = re.search(r"^\s*(?:source|rsource)\s+[\"']?([^\"'\s\n]+)[\"']?", line)
                                  if m:
                                      target = m.group(1).strip()
                                      rel_target = os.path.normpath(os.path.join(root, target)) if "rsource" in line else os.path.normpath(target)
                                      if not os.path.exists(rel_target):
                                          create_stub_dir(os.path.dirname(rel_target))
                                          open(rel_target, "w").close()
                                          modified = True
                                          continue
                                  new_lines.append(line)
                              if modified:
                                  with open(filepath, "w") as f:
                                      f.writelines(new_lines)
                          except Exception:
                              pass

          # 2. Fix Missing Makefile subdirectories (like rootguard, sched_assist)
          mk_pattern = re.compile(r'(?:obj-[\w\$\(\)]+|core-y|drivers-y|libs-y|net-y|subdir-y)\s*\+?=\s*([a-zA-Z0-9_\-\/]+)/')
          for _ in range(3):
              for root, _, files in os.walk("."):
                  for file in files:
                      if file in ["Makefile", "Kbuild"] or file.endswith(".mk"):
                          filepath = os.path.join(root, file)
                          try:
                              with open(filepath, "r", errors="ignore") as f:
                                  content = f.read()
                              for sub in mk_pattern.findall(content):
                                  sub = sub.strip()
                                  if sub:
                                      target_dir = os.path.normpath(os.path.join(root, sub))
                                      if not os.path.exists(os.path.join(target_dir, "Makefile")):
                                          create_stub_dir(target_dir)
                          except Exception:
                              pass
          EOF
          python3 auto_fix_source.py
          rm auto_fix_source.py

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$(pwd)/toolchain/clang/bin:$(pwd)/toolchain/gcc64/bin:$(pwd)/toolchain/gcc32/bin:$PATH

          CONFIG_PATH=$(find arch/arm64/configs -type f \( -name "*roma*" -o -name "*3686*" -o -name "*k6873*" -o -name "*defconfig*" \) | head -n 1)
          TARGET_DEFCONFIG=$(basename $CONFIG_PATH)
          
          echo "CONFIG_KSU=y" >> $CONFIG_PATH
          echo "CONFIG_KSU_TAMPER_SYS_CALL=y" >> $CONFIG_PATH

          make O=out $TARGET_DEFCONFIG

          KCFLAGS="-w" make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y

      - name: Pack Kernel Output with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          else
            exit 1
          fi

          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} AnyKernel3/ \; 2>/dev/null || true

          cd AnyKernel3
          zip -r ../KernelSU-Next-RMX3686-Flashable.zip * -x .git\* README.md

      - name: Upload Kernel Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Flashable
          path: KernelSU-Next-RMX3686-Flashable.zip