name: Build KernelSU Next Auto Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc libncurses5-dev libssl-dev flex bison libelf-dev zip unzip libc6-dev-i386 lib32z1-dev python3 liblz4-tool ccache

      - name: Cache Toolchains & CCache
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            ~/.ccache
          key: toolchains-proton-gcc-v1

      - name: Fetch Toolchains Fast
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain/clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/gcc32

      - name: Integrate KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Pre-fix Broken Symlinks, Kconfig and Makefiles
        run: |
          cat << 'EOF' > auto_fix_source.py
          import os, re, shutil

          print("--- Starting Auto-Fix for Broken Symlinks & Kernel Source ---")

          for root, dirs, files in os.walk(".", topdown=False):
              for name in files + dirs:
                  full_path = os.path.join(root, name)
                  if os.path.islink(full_path):
                      if not os.path.exists(full_path):
                          print(f"[REMOVING BROKEN SYMLINK] {full_path}")
                          try:
                              os.unlink(full_path)
                          except Exception:
                              pass

          def ensure_dir(path):
              if not path or path == ".":
                  return
              if os.path.islink(path) or (os.path.exists(path) and not os.path.isdir(path)):
                  try:
                      os.remove(path)
                  except Exception:
                      try:
                          shutil.rmtree(path)
                      except Exception:
                          pass
              os.makedirs(path, exist_ok=True)

          def ensure_file(path, default_content=""):
              parent = os.path.dirname(path)
              if parent:
                  parts = parent.split(os.sep)
                  curr = ""
                  for p in parts:
                      curr = os.path.join(curr, p) if curr else p
                      ensure_dir(curr)
              
              if os.path.islink(path) or (os.path.exists(path) and os.path.isdir(path)):
                  try:
                      shutil.rmtree(path)
                  except Exception:
                      try:
                          os.remove(path)
                      except Exception:
                          pass

              if not os.path.exists(path):
                  with open(path, "w") as f:
                      f.write(default_content)

          for _ in range(2):
              for root, dirs, files in os.walk("."):
                  for f in files:
                      if "Kconfig" in f:
                          kpath = os.path.normpath(os.path.join(root, f))
                          try:
                              with open(kpath, "r", errors="ignore") as file_obj:
                                  lines = file_obj.readlines()
                              
                              new_lines = []
                              modified = False
                              for line in lines:
                                  matches = re.findall(r'(?:source|rsource)\s+["\']?([^"\'\s\n#]+)["\']?', line)
                                  if matches:
                                      for target in matches:
                                          target = target.strip()
                                          if not target:
                                              continue
                                          rel_target = os.path.normpath(os.path.join(root, target)) if "rsource" in line else os.path.normpath(target)
                                          
                                          if not os.path.isfile(rel_target):
                                              parent = os.path.dirname(rel_target)
                                              if parent:
                                                  ensure_dir(parent)
                                                  ensure_file(os.path.join(parent, "Makefile"), "obj-y +=\n")
                                              
                                              ensure_file(rel_target, "\n")
                                              print(f"[FIXED KCONFIG] Created stub for: {rel_target}")
                                              line = "# " + line
                                              modified = True
                                  new_lines.append(line)
                              
                              if modified:
                                  with open(kpath, "w") as file_obj:
                                      file_obj.writelines(new_lines)
                          except Exception as e:
                              print(f"Error on {kpath}: {e}")

          mk_pattern = re.compile(r'(?:obj-[\w\$\(\)]+|core-y|drivers-y|libs-y|net-y|subdir-y)\s*\+?=\s*([a-zA-Z0-9_\-\/]+)/')
          for root, dirs, files in os.walk("."):
              for f in files:
                  if f in ["Makefile", "Kbuild"] or f.endswith(".mk"):
                      mpath = os.path.normpath(os.path.join(root, f))
                      try:
                          with open(mpath, "r", errors="ignore") as file_obj:
                              content = file_obj.read()
                          
                          for sub in mk_pattern.findall(content):
                              sub = sub.strip()
                              if sub:
                                  target_dir = os.path.normpath(os.path.join(root, sub))
                                  target_mk = os.path.join(target_dir, "Makefile")
                                  if not os.path.isfile(target_mk):
                                      ensure_dir(target_dir)
                                      ensure_file(target_mk, "obj-y +=\n")
                                      ensure_file(os.path.join(target_dir, "Kconfig"), "\n")
                                      print(f"[FIXED MAKEFILE] Created stub dir: {target_dir}")
                      except Exception as e:
                          print(f"Error on {mpath}: {e}")

          print("--- Auto-Fix Completed ---")
          EOF
          python3 auto_fix_source.py
          rm auto_fix_source.py

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          CLANG_DIR="$(pwd)/toolchain/clang/bin"
          GCC64_DIR="$(pwd)/toolchain/gcc64/bin"
          GCC32_DIR="$(pwd)/toolchain/gcc32/bin"

          export PATH=$GCC64_DIR:$GCC32_DIR:$PATH:$CLANG_DIR

          CONFIG_PATH=$(find arch/arm64/configs -type f \( -name "*roma*" -o -name "*3686*" -o -name "*k6873*" -o -name "*defconfig*" \) | head -n 1)
          TARGET_DEFCONFIG=$(basename $CONFIG_PATH)
          
          echo "CONFIG_KSU=y" >> $CONFIG_PATH
          echo "CONFIG_KSU_TAMPER_SYS_CALL=y" >> $CONFIG_PATH

          make O=out HOSTCC=gcc HOSTCXX=g++ $TARGET_DEFCONFIG

          KCFLAGS="-w" make -j$(nproc) O=out \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=$CLANG_DIR/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$GCC64_DIR/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$GCC32_DIR/arm-linux-androideabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y

      - name: Pack Kernel Output with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          else
            exit 1
          fi

          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} AnyKernel3/ \; 2>/devnull || true

          cd AnyKernel3
          zip -r ../KernelSU-Next-RMX3686-Flashable.zip * -x .git\* README.md

      - name: Upload Kernel Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Flashable
          path: KernelSU-Next-RMX3686-Flashable.zip